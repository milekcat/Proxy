name: Build ProxyVPN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ProxyVPN-Android-source/ProxyVPN-Android
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run offline proxy tests
        run: bash tests/offline/run.sh
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ProxyVPN-debug-apk
          path: ProxyVPN-Android-source/ProxyVPN-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
